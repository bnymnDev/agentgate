name: agentgate
description: Put agentgate in front of the MCP tools an agent uses in a workflow, and check the policy on the way in.
author: Bünyamin Ulupinar
branding:
  icon: shield
  color: gray-dark

inputs:
  version:
    description: The agentgate release to install, e.g. v0.4.0, or latest.
    default: latest
  binary:
    description: Use this agentgate binary instead of downloading one.
    default: ""
  config:
    description: An agentgate.yaml to validate and lint. Optional.
    default: ""
  lint:
    description: What a lint warning does — fail the step, warn, or off.
    default: fail
  tests:
    description: Policy tests to run against the config — auto runs the test file next to it if there is one, off runs none, anything else names a test file.
    default: auto
  skills:
    description: A project directory whose Agent Skills to check against its skills.lock — fails the step on any change nobody approved. Empty checks none.
    default: ""
  skills-lockfile:
    description: The skills lockfile, if it is not skills.lock in the skills directory.
    default: ""
  skills-fail:
    description: Whether unapproved skill changes fail the step, true or false. Either way the report goes to the job summary.
    default: "true"

outputs:
  path:
    description: Where the agentgate binary is.
    value: ${{ steps.install.outputs.path }}
  version:
    description: The version installed.
    value: ${{ steps.install.outputs.version }}
  skills-report:
    description: A Markdown file with the skills report, for a pull request comment. Set when skills is.
    value: ${{ steps.skills.outputs.report }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        BINARY: ${{ inputs.binary }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        dest="$RUNNER_TEMP/agentgate-bin"
        mkdir -p "$dest"
        exe=agentgate
        [ "$RUNNER_OS" = "Windows" ] && exe=agentgate.exe

        if [ -n "$BINARY" ]; then
          cp "$BINARY" "$dest/$exe"
          chmod +x "$dest/$exe"
        else
          if [ "$VERSION" = "latest" ]; then
            # The redirect names the newest release without using the API.
            VERSION=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/bnymnDev/agentgate/releases/latest)
            VERSION=${VERSION##*/}
          fi
          case "$RUNNER_OS" in
            Linux) os=linux ;; macOS) os=darwin ;; Windows) os=windows ;;
            *) echo "unsupported runner OS $RUNNER_OS" >&2; exit 1 ;;
          esac
          case "$RUNNER_ARCH" in
            X64) arch=amd64 ;; ARM64) arch=arm64 ;;
            *) echo "unsupported runner architecture $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          ext=tar.gz
          [ "$os" = "windows" ] && ext=zip
          asset="agentgate_${VERSION#v}_${os}_${arch}.${ext}"
          base="https://github.com/bnymnDev/agentgate/releases/download/${VERSION}"
          work="$RUNNER_TEMP/agentgate-download"
          mkdir -p "$work"
          curl -fsSL -o "$work/$asset" "$base/$asset"
          curl -fsSL -o "$work/checksums.txt" "$base/checksums.txt"
          want=$(grep " ${asset}\$" "$work/checksums.txt" | cut -d' ' -f1)
          if command -v sha256sum >/dev/null; then
            got=$(sha256sum "$work/$asset" | cut -d' ' -f1)
          else
            got=$(shasum -a 256 "$work/$asset" | cut -d' ' -f1)
          fi
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "checksum mismatch for $asset" >&2; exit 1
          fi
          if [ "$ext" = "zip" ]; then
            unzip -q -o "$work/$asset" -d "$work/x"
          else
            mkdir -p "$work/x" && tar -xzf "$work/$asset" -C "$work/x"
          fi
          cp "$work/x/$exe" "$dest/$exe"
        fi

        echo "$dest" >> "$GITHUB_PATH"
        echo "path=$dest/$exe" >> "$GITHUB_OUTPUT"
        installed=$("$dest/$exe" --version | awk '{print $3}')
        echo "version=$installed" >> "$GITHUB_OUTPUT"
        echo "agentgate $installed installed at $dest/$exe"

    - if: inputs.config != ''
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        LINT: ${{ inputs.lint }}
        TESTS: ${{ inputs.tests }}
        AGENTGATE: ${{ steps.install.outputs.path }}
      run: |
        set -euo pipefail
        "$AGENTGATE" policy validate "$CONFIG"
        # policy lint and test came with 0.4.0; an older release only validates.
        installed=$("$AGENTGATE" --version | awk '{print $3}')
        case "$installed" in
          0.[0-3].*|v0.[0-3].*)
            echo "::notice::agentgate $installed has no policy lint or test; they run from 0.4.0 on"
            exit 0 ;;
        esac
        case "$LINT" in
          off) ;;
          warn) "$AGENTGATE" policy lint "$CONFIG" || echo "::warning::agentgate policy lint found problems in $CONFIG" ;;
          *) "$AGENTGATE" policy lint "$CONFIG" ;;
        esac
        case "$TESTS" in
          off) ;;
          auto) "$AGENTGATE" test --config "$CONFIG" --missing-ok ;;
          *) "$AGENTGATE" test --config "$CONFIG" "$TESTS" ;;
        esac

    - if: inputs.skills != ''
      id: skills
      shell: bash
      env:
        SKILLS_DIR: ${{ inputs.skills }}
        SKILLS_LOCKFILE: ${{ inputs.skills-lockfile }}
        SKILLS_FAIL: ${{ inputs.skills-fail }}
        AGENTGATE: ${{ steps.install.outputs.path }}
      run: |
        set -uo pipefail
        # skills came after 0.4.0. A check that was asked for and cannot run
        # fails rather than passing without having looked.
        installed=$("$AGENTGATE" --version | awk '{print $3}')
        case "$installed" in
          0.[0-4].*|v0.[0-4].*)
            echo "::error::agentgate $installed has no skills command; it comes with the release after 0.4.0"
            exit 1 ;;
        esac
        args=(skills verify --dir "$SKILLS_DIR")
        if [ -n "$SKILLS_LOCKFILE" ]; then args+=(--lockfile "$SKILLS_LOCKFILE"); fi
        report="$RUNNER_TEMP/agentgate-skills.md"
        "$AGENTGATE" "${args[@]}" --markdown > "$report"
        status=$?
        if [ "$status" -ne 0 ] && ! head -n 1 "$report" | grep -q '^### agentgate skills'; then
          # Not drift: the check itself failed (no lockfile, a broken one).
          echo "::error::agentgate skills verify could not check the skills; see the message above"
          exit 1
        fi
        cat "$report" >> "$GITHUB_STEP_SUMMARY"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        if [ "$status" -ne 0 ]; then
          # The same report, readable in the log. Skill text is not allowed
          # to issue workflow commands from there.
          token="agentgate-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$token"
          "$AGENTGATE" "${args[@]}" --color never || true
          echo "::$token::"
          if [ "$SKILLS_FAIL" = "false" ]; then
            echo "::warning::skills changed without approval; see the job summary"
            exit 0
          fi
          echo "::error::skills changed without approval; review with agentgate skills diff, then agentgate skills approve"
          exit 1
        fi
