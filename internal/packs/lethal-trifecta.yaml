name: lethal-trifecta
description: >-
  An agent that has read untrusted content, can reach private data and can
  send things out can be talked into leaking that data. This pack labels
  sessions that fetch web pages, issues or mail as untrusted-input, and from
  then on asks a human before the session sends anything anywhere. A session
  whose tool results carried hidden text or instructions aimed at the model
  (the injection-suspected label agentgate attaches itself) sends nothing at
  all.
labels:
  - label: untrusted-input
    tool: "*"
    when:
      tool_name:
        regex: '(?i)(fetch|browse|navigate|scrape|crawl|web_?search|search_web|read_url|get_url|open_url|http_get|download|get_issue|list_issues|search_issues|issue_read|get_pull_request|list_pull_requests|get_comments|read_email|get_email|list_emails|search_emails|get_message|list_messages|read_message|get_page|read_page|screenshot)'
  - label: private-data
    tool: "*"
    when:
      "args.{path,paths,file,files,file_path,filePath,filename,command,cmd}":
        regex: '(?i)(\.env\b|secret|credential|token|\.ssh/|\.aws/|passw)'
rules:
  - id: injected-egress
    tool: "*"
    when:
      session.label.injection-suspected: true
      tool_name:
        regex: '(?i)(send|post|publish|upload|email|mail|message|comment|reply|create|update|push|webhook|request|fetch|http|navigate|browse|share|exec|run|command)'
    action: deny
    reason: "suspected prompt injection: a tool result this session read carried hidden text or instructions aimed at the model, so nothing leaves the session now"

  - id: trifecta
    tool: "*"
    when:
      session.label.untrusted-input: true
      session.label.private-data: true
      tool_name:
        regex: '(?i)(send|post|publish|upload|email|mail|message|comment|reply|create|update|push|webhook|request|fetch|http|navigate|browse|share|exec|run|command)'
    action: ask
    reason: "this session read untrusted content and private data; it could be leaking one through the other"

  - id: trifecta-canary
    tool: "*"
    when:
      session.label.untrusted-input: true
      session.label.canary-read: true
      tool_name:
        regex: '(?i)(send|post|publish|upload|email|mail|message|comment|reply|create|update|push|webhook|request|fetch|http|navigate|browse|share|exec|run|command)'
    action: ask
    reason: "this session read untrusted content and a planted credential; it could be leaking one through the other"

  - id: egress-after-untrusted
    tool: "*"
    when:
      session.label.untrusted-input: true
      tool_name:
        regex: '(?i)(send|post|publish|upload|email|mail|message|comment|reply|create|update|push|webhook|request|fetch|http|navigate|browse|share)'
    action: ask
    reason: "this session has read untrusted content; anything that can send data out now needs a human"

  - id: shell-egress-after-untrusted
    tool: "*"
    when:
      session.label.untrusted-input: true
      "args.{command,cmd,script,code,input}":
        regex: '(?i)\b(curl|wget|nc|ncat|ssh|scp|rsync|ftp|sftp|telnet|Invoke-WebRequest|iwr)\b'
    action: ask
    reason: "this session has read untrusted content; network commands now need a human"
