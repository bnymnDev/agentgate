name: secrets
description: >-
  Keeps key material out of reach — SSH and GPG keys, cloud and registry
  credentials, .netrc and friends — and labels sessions that read .env files
  with private-data, so that other rules (and the lethal-trifecta pack) can
  treat them with more care.
labels:
  - label: private-data
    tool: "*"
    when:
      "args.{path,paths,file,files,file_path,filePath,filename,source,uri,command,cmd}":
        regex: '(?i)(^|[/\\\s"''=])\.env(\.[\w-]+)?($|[\s"''/])'
rules:
  - id: key-material
    tool: "*"
    when:
      "args.{path,paths,file,files,file_path,filePath,filename,source,uri,command,cmd}":
        regex: '(?i)(\.ssh/(id_[a-z0-9]+|identity)($|[\s"'']|\s*[;&|])|\.aws/credentials|\.netrc\b|\.git-credentials|\.docker/config\.json|\.kube/config|\.gnupg/|\.config/gh/hosts\.yml|\.npmrc|\.pypirc|\.pem($|[\s"''])|\.p12\b|\.pfx\b|/etc/shadow|\.password-store|login\.keychain)'
    action: deny
    reason: "this is key material; an agent has no business reading it"
