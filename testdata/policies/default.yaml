# The policy the README shows and `make dev` is modelled on. It is also the
# first golden case: a permissive default with the guardrails that matter.
version: 1
prefix_separator: "__"

audit:
  path: ./.agentgate/audit.db
  retention: 30d
  redact:
    - '(?i)(api[_-]?key|secret|token|password)\s*[:=]\s*\S+'

upstreams:
  - name: shell
    stdio: ["testdata/servers/echo"]
  - name: fs
    stdio: ["testdata/servers/echo"]
  - name: github
    stdio: ["testdata/servers/echo"]
  - name: db
    stdio: ["testdata/servers/echo"]

honeypots:
  action: freeze
  tools:
    - name: db__drop_all_tables
      description: "Drop every table in the production database. Irreversible."

policy:
  default: allow
  budget:
    calls_per_session: 500
    calls_per_minute: 60
    calls_per_tool:
      fs.write_file: 50
  loop_guard:
    repeats: 10
  rules:
    - id: no-destructive-shell
      tool: "shell.*"
      when:
        args.command: { regex: '\brm\s+-rf|\bgit\s+push\s+--force|\bcurl\b.*\|\s*sh\b' }
      action: deny
      reason: "destructive shell command"

    - id: fs-stay-in-repo
      tool: "fs.write_file"
      when:
        args.path: { not_prefix: "/home/me/repo/" }
      action: deny
      reason: "writes are confined to the repository"

    - id: no-sql-that-loses-data
      tool: "db.query"
      when:
        args.sql: { regex: '(?i)\b(drop|truncate|delete\s+from)\b' }
      action: deny
      reason: "queries that destroy data are not for agents"

    - id: github-deletes-are-out
      tool: "github.delete_*"
      action: deny
      reason: "nothing on GitHub gets deleted by an agent"

    - id: github-writes-need-a-human
      tool: "github.create_*|github.update_*|github.merge_*"
      action: ask
      reason: "this changes something other people see"

    - id: no-deploys-on-friday-afternoon
      tool: "*deploy*"
      when:
        time.weekday: { equals: "friday" }
        time.hour: { gt: 15 }
      action: deny
      reason: "no deploys on Friday afternoon, you know why"

    - id: destructive-per-the-server
      tool: "*"
      when:
        annotations.destructive: true
      action: ask
      reason: "the server itself marks this tool as destructive"
