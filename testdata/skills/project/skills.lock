      "instructions": "---\nname: notes\ndescription: Keep meeting notes in notes/ as dated Markdown files. Use when the user asks to take, find or summarise notes.\n---\n\n# Notes\n\nNotes live in `notes/`, one file per meeting, named `YYYY-MM-DD-topic.md`.\n\n- To take notes, create the file and write the agenda, the decisions and the follow-ups as three sections.\n- To find notes, run `scripts/find.sh <word>` and show the matching lines.\n- To summarise, read the files the user names and list the decisions first.\n\nKeep the user's wording for decisions; do not paraphrase them.\n",
