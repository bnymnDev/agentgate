# goreleaser configuration — https://goreleaser.com
version: 2

project_name: agentgate

before:
  hooks:
    - go mod tidy

builds:
  - id: agentgate
    main: ./cmd/agentgate
    binary: agentgate
    env:
      # Pure Go all the way down: modernc.org/sqlite needs no cgo, so the
      # binaries cross-compile and run anywhere without a libc to match.
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - docs/*.md
      - src: testdata/policies/default.yaml
        dst: examples/agentgate.yaml

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Everything else
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

# Homebrew. The cask is committed into this repository, under Casks/, by the
# release job's own token, so there is no second repository and no extra
# secret. Users run
#   brew tap bnymnDev/agentgate https://github.com/bnymnDev/agentgate
#   brew install --cask agentgate
homebrew_casks:
  - name: agentgate
    repository:
      owner: bnymnDev
      name: agentgate
      branch: main
    directory: Casks
    commit_author:
      name: Bünyamin Ulupinar
      email: 88560587+bnymnDev@users.noreply.github.com
    commit_msg_template: "chore(brew): cask for {{ .ProjectName }} {{ .Tag }}"
    homepage: https://github.com/bnymnDev/agentgate
    description: Firewall, kill switch and flight recorder for your AI agent's tools
    license: GPL-3.0-or-later
    binaries: [agentgate]
    skip_upload: auto
    hooks:
      post:
        # The binaries are not notarized; lift the quarantine flag so macOS
        # runs what Homebrew just installed.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/agentgate"]
          end

release:
  footer: |
    ## Install

    ```
    go install github.com/bnymnDev/agentgate/cmd/agentgate@{{ .Tag }}

    brew tap bnymnDev/agentgate https://github.com/bnymnDev/agentgate
    brew install --cask agentgate
    ```
