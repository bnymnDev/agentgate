# goreleaser configuration — https://goreleaser.com
version: 2

project_name: agentgate

before:
  hooks:
    - go mod tidy

builds:
  - id: agentgate
    main: ./cmd/agentgate
    binary: agentgate
    env:
      # Pure Go all the way down: modernc.org/sqlite needs no cgo, so the
      # binaries cross-compile and run anywhere without a libc to match.
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - docs/*.md
      - src: testdata/policies/default.yaml
        dst: examples/agentgate.yaml

checksum:
  name_template: checksums.txt

# A software bill of materials per archive, made by syft: every module the
# binary was built from, with its version, for vulnerability scanners.
sboms:
  - artifacts: archive

# Keyless signing with Sigstore: the release job's own GitHub identity signs
# the checksum file, which covers every archive and SBOM, and the signature
# is logged in the public transparency log. There is no key to leak.
#   cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/bnymnDev/agentgate/\.github/workflows/release\.yaml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    output: true

# The container images are signed the same way:
#   cosign verify ghcr.io/bnymndev/agentgate:<version> \
#     --certificate-identity-regexp '^https://github.com/bnymnDev/agentgate/\.github/workflows/release\.yaml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
docker_signs:
  - cmd: cosign
    artifacts: all
    args: ["sign", "--yes", "${artifact}@${digest}"]
    output: true

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Everything else
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

# Homebrew. The cask is committed into this repository, under Casks/, by the
# release job's own token, so there is no second repository and no extra
# secret. Users run
#   brew tap bnymnDev/agentgate https://github.com/bnymnDev/agentgate
#   brew install --cask agentgate
homebrew_casks:
  - name: agentgate
    repository:
      owner: bnymnDev
      name: agentgate
      branch: main
    directory: Casks
    commit_author:
      name: Bünyamin Ulupinar
      email: 88560587+bnymnDev@users.noreply.github.com
    commit_msg_template: "chore(brew): cask for {{ .ProjectName }} {{ .Tag }}"
    homepage: https://github.com/bnymnDev/agentgate
    description: Firewall, tripwires and flight recorder for your AI agent's tools
    license: GPL-3.0-or-later
    binaries: [agentgate]
    skip_upload: auto
    hooks:
      post:
        # The binaries are not notarized; lift the quarantine flag so macOS
        # runs what Homebrew just installed.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/agentgate"]
          end

# Container images for linux/amd64 and linux/arm64 on GitHub's registry.
dockers_v2:
  - images:
      - ghcr.io/bnymndev/agentgate
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: build/release.Dockerfile
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.title: agentgate
      org.opencontainers.image.description: Firewall, tripwires and flight recorder for your AI agent's tools
      org.opencontainers.image.source: https://github.com/bnymnDev/agentgate
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: GPL-3.0-or-later

release:
  footer: |
    ## Install

    ```
    go install github.com/bnymnDev/agentgate/cmd/agentgate@{{ .Tag }}

    brew tap bnymnDev/agentgate https://github.com/bnymnDev/agentgate
    brew install --cask agentgate

    docker pull ghcr.io/bnymndev/agentgate:{{ .Version }}
    ```

    ## Verify

    Every archive is covered by `checksums.txt`, which is signed keylessly by
    this repository's release workflow; each archive also has an SBOM and
    build provenance.

    ```
    cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
      --certificate-identity-regexp '^https://github.com/bnymnDev/agentgate/\.github/workflows/release\.yaml@' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    sha256sum --ignore-missing -c checksums.txt

    gh attestation verify agentgate_{{ .Version }}_linux_amd64.tar.gz --repo bnymnDev/agentgate
    ```
