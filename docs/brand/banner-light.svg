<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="agentgate: firewall, kill switch and flight recorder for your AI agent's tools">
  <rect width="1200" height="300" rx="18" fill="#f6f7f9"/>
  <!-- traffic arrives from the left, passes the gate, continues to the right -->
  <line x1="36" y1="150" x2="188" y2="150" stroke="#c9ced8" stroke-width="4" stroke-dasharray="10 12" stroke-linecap="round"/>
  <line x1="1012" y1="150" x2="1164" y2="150" stroke="#c9ced8" stroke-width="4" stroke-dasharray="10 12" stroke-linecap="round"/>
  <polygon points="1152,140 1170,150 1152,160" fill="#c9ced8"/>
  <!-- the gate: two posts -->
  <rect x="200" y="78" width="7" height="144" rx="3.5" fill="#0b7bd6"/>
  <rect x="993" y="78" width="7" height="144" rx="3.5" fill="#0b7bd6"/>
  <!-- wordmark -->
  <text x="600" y="168" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="104" font-weight="700" letter-spacing="-2" fill="#1b1f27">agent<tspan fill="#0b7bd6">gate</tspan></text>
  <text x="600" y="236" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#5c6570">firewall, kill switch and flight recorder for your AI agent's tools</text>
</svg>
